<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Prompt Aid · Local host test</title><style>body{margin:0;background:#e7eee7;font:14px system-ui;color:#173323}header{padding:12px 20px;background:#1e3828;color:white}header p{margin:4px 0}iframe{border:0;width:100%;height:850px}#result{white-space:pre-wrap}</style></head><body><header><strong>Simulated MCP host — not Codex</strong><p id="result" role="status">Waiting for the review card.</p></header><iframe id="card" src="/review" title="Prompt Aid review card"></iframe><script>
const frame=document.querySelector('#card'),result=document.querySelector('#result'),mode=location.hash.slice(1);
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;
if(m.method==='ui/initialize')frame.contentWindow.postMessage({jsonrpc:'2.0',id:m.id,result:{protocolVersion:'2026-01-26',hostInfo:{name:'local-test-host',version:'1'},hostCapabilities:mode==='unsupported'?{}:{message:{text:{}}},hostContext:{displayMode:'inline',availableDisplayModes:mode==='pip'?['inline','pip']:['inline']}}},'*');
if(m.method==='ui/notifications/initialized')frame.contentWindow.postMessage({jsonrpc:'2.0',method:'ui/notifications/tool-result',params:{structuredContent:{original:'Make the page clearer.',improved:'Improve the page’s readability while keeping its current behavior.',changes:['Clarified the goal.'],questions:[],limitations:['This is a local test.']}}},'*');
if(m.method==='ui/request-display-mode'){result.textContent='Simulated host changed view to: '+m.params.mode;frame.contentWindow.postMessage({jsonrpc:'2.0',id:m.id,result:{mode:m.params.mode}},'*');}
if(m.method==='ui/message'){result.textContent=mode==='reject'?'Simulated host rejected the request.':'Simulated chat received: '+m.params.content[0].text;frame.contentWindow.postMessage({jsonrpc:'2.0',id:m.id,result:mode==='reject'?{isError:true}:{}},'*');}
});
</script></body></html>
