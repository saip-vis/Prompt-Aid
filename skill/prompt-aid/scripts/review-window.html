<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt Aid — Review</title><style>
:root{color-scheme:dark;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#151b18;color:#eef3ec}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #39473d;padding-bottom:16px}.brand{font-weight:750;letter-spacing:-.02em}.mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#bcdcb3;color:#213b29;margin-right:9px;font:21px Georgia}header small{color:#a2b5a2}h1{font:400 32px/1.15 Georgia,serif;letter-spacing:-.03em;margin:28px 0 7px}.intro{color:#a7b8a8;margin:0 0 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{background:#202a22;border:1px solid #415144;border-radius:11px;padding:17px;min-width:0}label{display:block;font-size:13px;font-weight:700;margin-bottom:10px}textarea{display:block;width:100%;min-height:220px;resize:vertical;background:#141c16;border:1px solid #475b49;border-radius:7px;padding:12px;color:#eff6ec;font:14px/1.6 inherit;font-family:inherit;font-size:14px;line-height:1.6}textarea[readonly]{color:#b8c9b7}textarea:focus-visible,button:focus-visible{outline:2px solid #c5e2b4;outline-offset:3px}.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:17px}.note{padding:0 3px;color:#b9cbbb;font-size:13px}.note h2{font-size:12px;color:#e8f2e4;margin:0 0 7px}.note ul{margin:0;padding-left:18px}.actions{display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid #39473d;margin-top:25px;padding-top:17px}.hint{max-width:520px;color:#9fb1a0;font-size:12px}.buttons{display:flex;gap:9px}.buttons button{font:700 13px inherit;border-radius:7px;padding:11px 16px;cursor:pointer}.cancel{border:1px solid #657965;background:transparent;color:#d4e2d0}.run{border:1px solid #bddcad;background:#bddcad;color:#1b3522}.run:disabled,.cancel:disabled{opacity:.5;cursor:default}#status{font-size:13px;min-height:20px;color:#dcebd8;margin-top:12px}@media(max-width:680px){main{padding:18px}.grid,.notes{grid-template-columns:1fr}textarea{min-height:140px}.actions{align-items:flex-start;flex-direction:column}.buttons{width:100%}.run{flex:1}header small{font-size:11px}}
</style></head><body><main><header><div class="brand"><span class="mark">p</span>Prompt Aid</div><small>Review before running</small></header><h1>Make your request clearer.</h1><p class="intro">Compare the drafts, adjust the suggestion, then choose what happens next.</p><div class="grid"><div class="card"><label for="original">Original prompt</label><textarea id="original" readonly></textarea></div><div class="card"><label for="improved">Suggested prompt · editable</label><textarea id="improved"></textarea></div></div><div class="notes" id="notes"></div><div class="actions"><span class="hint">Run returns this prompt to the active Prompt Aid session for Codex to carry out. It does not send a new message to your chat.</span><div class="buttons"><button class="cancel" id="cancel">Cancel</button><button class="run" id="run" disabled>Run with Codex →</button></div></div><div role="status" aria-live="polite" id="status">Loading review…</div></main><script>
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);const original=document.querySelector('#original'),improved=document.querySelector('#improved'),run=document.querySelector('#run'),cancel=document.querySelector('#cancel'),status=document.querySelector('#status'),notes=document.querySelector('#notes');let busy=false;
async function send(path,body){const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(body)});if(!res.ok)throw Error('The review session is unavailable.');return res.json();}
function availability(){run.disabled=busy||!improved.value.trim()||improved.value.length>16000;}
function addNotes(label,items){if(!Array.isArray(items)||!items.length)return;const section=document.createElement('section');section.className='note';const heading=document.createElement('h2');heading.textContent=label;const list=document.createElement('ul');for(const text of items){const item=document.createElement('li');item.textContent=text;list.append(item);}section.append(heading,list);notes.append(section);}
async function decide(action){if(busy)return;busy=true;availability();cancel.disabled=true;status.textContent='Sending your decision…';try{await send('/decision',action==='run'?{action,prompt:improved.value}:{action});status.textContent=action==='run'?'Sent to the active Prompt Aid session. You can close this window.':'Cancelled. You can close this window.';original.disabled=true;improved.disabled=true;}catch(error){busy=false;cancel.disabled=false;availability();status.textContent=error.message;}}
improved.addEventListener('input',availability);run.addEventListener('click',()=>decide('run'));cancel.addEventListener('click',()=>decide('cancel'));
send('/review',{}).then(data=>{original.value=data.original;improved.value=data.improved;addNotes('What changed',data.changes);addNotes('Questions',data.questions);addNotes('Limitations',data.limitations);status.textContent='';availability();}).catch(error=>{status.textContent=error.message;cancel.disabled=true;});
</script></body></html>
